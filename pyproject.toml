[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manim_extensions"
version = "1.0.5"
description = "A package for tools and extensions in Manim"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "ExploreMaths"},
]
keywords = ["manim", "animation", "math", "latex", "geometry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: OS Independent",
]
# Core: only manim and numpy. Everything else either ships with manim
# itself (Pillow, scipy, networkx, click, rich, moderngl) or is split
# into the per-module extras below and lazy-imported on use.
dependencies = [
    "manim>=0.21.0",
    "numpy>=2.0",
    # manim-mobject-svg (used by svg_animations.HTMLParsedVMobject) works
    # with any manim>=0.16, but its 0.5.x release declares python<3.13 on
    # PyPI even though the package is pure Python; on Python 3.13+ install
    # it with `pip install --ignore-requires-python manim-mobject-svg`.
    # The plugin is imported lazily, so it is only needed when using
    # HTMLParsedVMobject.
    "manim-mobject-svg>=0.5; python_version < '3.13'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.0",
    "sphinx-autodoc-typehints>=2.0",
    "myst-parser>=3.0",
    "docutils>=0.20",
    "jinja2>=3.1",
]
# automata: JSON/XML template parsing
automata = [
    "xmltodict>=0.13",
]
# chemistry: element data, periodic table, PubChem API
chemistry = [
    "pandas>=2.2",
    "xmltodict>=0.13",
    "requests>=2.31",
]
# physics: the pymunk subpackage plus rigid mechanics and optics
physics = [
    "pymunk>=6.0",
    "shapely>=2.0",
]
# rubikscube: Rubik's cube solving (rubikscube.RubiksCube.solve_by_kociemba)
rubikscube = [
    "kociemba>=1.2",
]
# meshes: mesh loading and 3D geometry (meshes subpackage)
meshes = [
    "trimesh>=4.0",
    "moderngl>=5.0",
]
# video: VideoMobject frame reading (mobjects.VideoMobject)
video = [
    "opencv-python>=4.5",
]
# qr: QR code generation (qr_codes.qr_code)
qr = [
    "segno>=1.5",
]
# svg: SVG path parsing (svg_animations)
svg = [
    "svgpathtools>=1.5",
]
# machine_learning: diffusion/decision-tree modules
ml = [
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "seaborn>=0.13",
    "tqdm>=4.65",
]

[project.urls]
Homepage = "https://github.com/ExploreMaths/manim_extensions"
Issues = "https://github.com/ExploreMaths/manim_extensions/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["manim_extensions*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"manim_extensions.meshes" = ["data/models/*.ply", "data/models/*.stl"]
# Vendored Nerd Font (see manim_extensions/utils/nerdfont/)
"manim_extensions.utils.nerdfont" = ["*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.flake8]
per-file-ignores = [
    ["**/__init__.py", "F401 F403"],
]
exclude = [
    "docs",
    "tests",
    "*.egg-info",
    "build",
]