[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manim_extensions"
version = "1.0.4"
description = "A package for tools and extensions in Manim"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "ExploreMaths"},
]
keywords = ["manim", "animation", "math", "latex", "geometry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: OS Independent",
]
dependencies = [
    "manim>=0.19.1",
    "Pillow",
    "opencv-python",
    "pymunk",
    "kociemba",
    "shapely",
    "trimesh",
    "xmltodict",
    "numpy>=2.0",
    "scipy",
    "moderngl",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.0",
    "sphinx-autodoc-typehints>=2.0",
    "myst-parser>=3.0",
]

[project.urls]
Homepage = "https://github.com/ExploreMaths/manim_extensions"
Issues = "https://github.com/ExploreMaths/manim_extensions/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["manim_extensions*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.flake8]
per-file-ignores = [
    ["**/__init__.py", "F401 F403"],
]
exclude = [
    "docs",
    "tests",
    "*.egg-info",
    "build",
]