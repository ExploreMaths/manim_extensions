name: Docs cache and build

# Pre-render every .. manim:: doc example into the `rtd-cache` branch, then
# build the Sphinx HTML on GitHub and publish it to the `rtd-html` branch.
# Read the Docs only copies that commit's prebuilt HTML into its output
# directory, so the RTD build no longer runs Sphinx or renders examples.
# Rendering is content-hash based, so unchanged examples are skipped.
#
# The rtd-cache branch also carries the vendored-status cache: the `render`
# job refreshes it on every push, and the `vendored-cache` job refreshes it
# every day. The scheduled run then rebuilds the prebuilt HTML so the
# vendored-status dates shown on the published pages actually advance.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  schedule:
    # Refresh the vendored-status cache and published docs daily at
    # 00:05 Asia/Shanghai (16:05 UTC on the previous day). Avoid the exact
    # top of the hour: GitHub Actions drops queued schedule runs under the
    # high load it sees at :00.
    - cron: "5 16 * * *"
  workflow_dispatch:
    inputs:
      rtd_only:
        description: "Only trigger a Read the Docs build for the branch (no media render)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  render:
    # Media rendering and the RTD trigger only happen for pushes/tags; the
    # daily schedule is handled by the vendored-cache job below.
    if: ${{ github.event_name != 'schedule' }}
    # Serialize pushes to the rtd-cache branch: each run does `git push -f`,
    # so concurrent runs (e.g. a fast sequence of commits to main) would
    # race and the last push wins, even if an earlier run rendered newer
    # media. Cancelling superseded runs avoids that race and saves CI
    # minutes. Scoped to this job so a scheduled vendored-cache run never
    # cancels (or gets cancelled by) a media render.
    concurrency:
      group: docs-cache
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The system stack (TeX/ffmpeg/xvfb) is large; cache the apt archives
      # and pip downloads so a job landing on a slow runner or slow network
      # does not re-download everything from scratch on every push.
      - name: Prepare apt cache dir
        run: sudo mkdir -p /var/cache/apt/archives && sudo chmod 777 /var/cache/apt/archives
      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ hashFiles('.github/workflows/docs-cache.yml') }}
          restore-keys: |
            apt-
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-3.12-
            pip-

      - name: Seed docs cache from the rtd-cache branch
        run: |
          git clone --depth 1 --branch rtd-cache \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            rtd-cache-clone || { echo "No existing media cache; rendering from scratch."; exit 0; }
          mkdir -p media_cache
          cp -r rtd-cache-clone/videos rtd-cache-clone/images rtd-cache-clone/manifest.json media_cache/ 2>/dev/null || true
          cp rtd-cache-clone/_nbcell_cache.json media_cache/ 2>/dev/null || true

      # Lightweight scan (no manim needed): if every example is already in
      # the cache at the requested quality, skip the whole render pipeline
      # below — including the TeX/LaTeX environment setup.
      - name: Check whether any rendering is needed
        id: needed
        run: |
          if python workflow/render_doc_examples.py --out media_cache --quality high --check \
            && python workflow/execute_nbcell_examples.py --check --cache media_cache/_nbcell_cache.json; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/configure-apt
      - uses: ExploreMaths/setup-manim-env@v1
        if: steps.needed.outputs.needed == 'true'
        with:
          # 3.12 so the manim-mobject-svg plugin (python<3.13 pin) installs
          # and HTMLParsedVMobject examples render; matches the RTD build.
          python-version: "3.12"
          install-full-deps: "true"
          install-editable: "true"

      - name: Install package with all extras
        if: steps.needed.outputs.needed == 'true'
        run: pip install ".[all]"

      - name: Render all doc examples
        if: steps.needed.outputs.needed == 'true'
        run: python workflow/render_doc_examples.py --out media_cache --workers 6 --quality high

      - name: Execute nbcell examples (real outputs)
        # Runs every nbcell block and caches the real stdout next to the
        # media; the Sphinx build (and Read the Docs, via the rtd-cache
        # branch) prefers the cached output over the hand-written one.
        if: steps.needed.outputs.needed == 'true'
        run: python workflow/execute_nbcell_examples.py --out media_cache/_nbcell_cache.json

      - name: Refresh vendored status cache
        # Runs on every push too (not only on the daily schedule) so the
        # rtd-cache branch always carries a fresh cache when the RTD build
        # is triggered below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python workflow/update_vendored_status.py

      - name: Include the vendored status cache in the media tree
        run: cp docs/source/_vendored_status_cache.json media_cache/_vendored_status_cache.json

      - name: Push docs cache to the rtd-cache branch
        id: push
        run: |
          set -e
          cd media_cache
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin rtd-cache || true
          git checkout -B rtd-cache
          git add -A
          if git diff --cached --quiet; then
            echo "Media unchanged; nothing to push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -q -m "docs media: refresh rendered examples"
            git push -f origin rtd-cache
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

  docs:
    # Push/tag runs wait for the media render; the daily schedule waits for
    # the vendored-status cache refresh so the rebuilt HTML shows today's
    # cache date. Either path then publishes rtd-html and triggers RTD.
    needs: [render, vendored-cache]
    if: ${{ always() && (needs.render.result == 'success' || github.event_name == 'schedule') && (needs.vendored-cache.result == 'success' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: docs-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      # Mirrors the system packages that .readthedocs.yaml used to install.
      - uses: ./.github/actions/configure-apt
      - name: Install RTD system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg fonts-jetbrains-mono fonts-noto-cjk fonts-hosny-amiri \
            graphviz libcairo2-dev libpango1.0-dev libffi-dev pkg-config

      - name: Fetch the complete media cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/rtd-cache
          git clone --depth 1 --branch rtd-cache \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/rtd-cache
          python workflow/render_doc_examples.py --out /tmp/rtd-cache --quality high --check
          python workflow/execute_nbcell_examples.py --check --cache /tmp/rtd-cache/_nbcell_cache.json

      - uses: ./.github/actions/configure-apt
      - uses: ExploreMaths/setup-manim-env@v1
        with:
          python-version: "3.12"
          # The old RTD build did not install the full TeX stack either; the
          # explicit apt packages above cover its documented system deps.
          install-editable: "true"

      - name: Install docs dependencies
        run: pip install ".[docs]"

      # The old RTD pre_build installed the vendored Nerd Font before Sphinx
      # started. Pango (>= 1.52) snapshots fonts at initialization, so this
      # must happen before the build step.
      - name: Install vendored Nerd Font
        run: python -c "import manim_extensions.nerdfont as nf; nf._install_font_linux()"

      - name: Build prebuilt HTML
        env:
          READTHEDOCS: "True"
        run: |
          cp /tmp/rtd-cache/_vendored_status_cache*.json docs/source/ 2>/dev/null || true
          cp /tmp/rtd-cache/_nbcell_cache.json docs/source/_extensions/_nbcell_cache.json
          python -m sphinx -T -j auto -b html -D language=en docs/source _build/html

      - name: Publish prebuilt docs to rtd-html
        id: publish
        run: |
          set -e
          PUBLISH_DIR="$RUNNER_TEMP/rtd-html-publish"
          HTML_DIR="$RUNNER_TEMP/rtd-html-publish-html"
          rm -rf "$PUBLISH_DIR" "$HTML_DIR"
          cp -a _build/html "$HTML_DIR"
          mkdir -p "$PUBLISH_DIR"
          cd "$PUBLISH_DIR"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --depth 1 origin rtd-html; then
            git checkout -B rtd-html FETCH_HEAD
          else
            git checkout -B rtd-html
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$HTML_DIR" ./html
          printf '%s\n' "$GITHUB_SHA" > commit
          git add -A
          git commit -q -m "docs html: $GITHUB_SHA"
          git push -f origin HEAD:rtd-html

      # Trigger a Read the Docs build only after the prebuilt HTML is on the
      # rtd-html branch. Branch pushes always rebuild; tag pushes also sync the
      # RTD version list first. Without the secret this is a no-op.
      - name: Trigger Read the Docs build
        env:
          RTD_TOKEN: ${{ secrets.READTHEDOCS_API_TOKEN }}
          RTD_PROJECT: manim-extensions
        run: |
          if [ -z "$RTD_TOKEN" ]; then
            echo "READTHEDOCS_API_TOKEN secret not set; skipping RTD trigger."
            exit 0
          fi
          BASE="https://app.readthedocs.org/api/v3/projects/$RTD_PROJECT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            curl -sf -X POST -H "Authorization: Token $RTD_TOKEN" "$BASE/versions/" \
              || echo "WARNING: version sync call failed, continuing anyway"
            SLUG=$(curl -sf -H "Authorization: Token $RTD_TOKEN" "$BASE/versions/?limit=100" \
              | jq -r --arg tag "$TAG" '.results[] | select(.verbose_name == $tag) | .slug' | head -1)
            if [ -z "$SLUG" ]; then
              echo "No RTD version for tag $TAG yet; waiting 30s for the sync..."
              sleep 30
              SLUG=$(curl -sf -H "Authorization: Token $RTD_TOKEN" "$BASE/versions/?limit=100" \
                | jq -r --arg tag "$TAG" '.results[] | select(.verbose_name == $tag) | .slug' | head -1)
            fi
            if [ -z "$SLUG" ]; then
              echo "ERROR: could not resolve an RTD version for tag $TAG."
              exit 1
            fi
            TARGET="$BASE/versions/$SLUG/builds/"
            echo "Triggering RTD build for tag $TAG (version slug: $SLUG)"
          else
            TARGET="$BASE/versions/latest/builds/"
          fi
          curl -sf -X POST -H "Authorization: Token $RTD_TOKEN" "$TARGET" \
            && echo "Read the Docs build triggered."

  # Daily refresh of the vendored-status cache between pushes. Kept in this
  # workflow so the rtd-cache branch has a single writer pipeline. The `docs`
  # job depends on this job on scheduled runs, so the cache refresh is
  # followed by an HTML rebuild and a Read the Docs build.
  vendored-cache:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch previous cache
        run: |
          git fetch --depth 1 origin rtd-cache || true
          git show origin/rtd-cache:_vendored_status_cache.json \
            > /tmp/old_cache.json 2>/dev/null || echo '{}' > /tmp/old_cache.json

      - name: Refresh cache
        env:
          # Provided automatically; raises the GitHub API rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python workflow/update_vendored_status.py --old-cache /tmp/old_cache.json --summary /tmp/summary.txt

      - name: Publish cache to the rtd-cache branch
        run: |
          git clone --depth 1 --branch rtd-cache \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            rtd-cache-clone
          cp docs/source/_vendored_status_cache.json \
            rtd-cache-clone/_vendored_status_cache.json
          cd rtd-cache-clone
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _vendored_status_cache.json
          git commit --allow-empty -m "$(cat /tmp/summary.txt)"
          git pull --rebase origin rtd-cache
          git push origin rtd-cache
