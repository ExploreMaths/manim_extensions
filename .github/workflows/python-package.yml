name: Python package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v4

      # The system stack (TeX/ffmpeg/xvfb) is large; cache the apt archives
      # and pip downloads so a job landing on a slow runner or slow network
      # does not re-download everything from scratch on every push.
      - name: Prepare apt cache dir
        run: sudo mkdir -p /var/cache/apt/archives && sudo chmod 777 /var/cache/apt/archives
      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ hashFiles('.github/workflows/python-package.yml') }}
          restore-keys: |
            apt-
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ matrix.python-version }}-
            pip-

      - uses: ExploreMaths/setup-manim-env@v1
        with:
          python-version: ${{ matrix.python-version }}
          install-editable: "true"
          install-full-deps: "true"

      - name: Install dev dependencies and all extras
        run: |
          pip install flake8 pytest-cov -e ".[dev,all]"

      - name: Lint with flake8
        run: |
          flake8 manim_extensions tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 manim_extensions tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: |
          xvfb-run -a pytest tests/ -v --cov=manim_extensions --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=90

      # The badge JSON is committed so shields.io can read it straight from
      # raw.githubusercontent.com; only one matrix leg writes it, and only on
      # main, so the other legs and PRs never race for the same file.
      - name: Refresh the coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.python-version == '3.12'
        run: |
          python workflow/coverage_badge.py coverage.json
          if git diff --quiet -- .github/badges/coverage.json; then
            echo "coverage badge unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.json
          git commit -m "Refresh the coverage badge"
          # Another leg or a bot commit may land first; rebase before pushing.
          git pull --rebase --autostash -q origin main || true
          git push || echo "coverage badge push skipped (concurrent update)"

  # Verify the declared lower bounds against the newest manim release,
  # so compatibility is tested rather than merely claimed.
  manim-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Prepare apt cache dir
        run: sudo mkdir -p /var/cache/apt/archives && sudo chmod 777 /var/cache/apt/archives
      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ hashFiles('.github/workflows/python-package.yml') }}
          restore-keys: |
            apt-
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-3.13-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-3.13-
            pip-

      - uses: ExploreMaths/setup-manim-env@v1
        with:
          python-version: "3.13"
          install-editable: "true"
          install-full-deps: "true"

      - name: Install dev dependencies and all extras
        run: |
          pip install -e ".[dev,all]"

      - name: Upgrade manim to the latest release
        run: |
          pip install --upgrade manim
          python -c "import manim; print('manim', manim.__version__)"

      - name: Test with pytest
        run: |
          xvfb-run -a pytest tests/ -q