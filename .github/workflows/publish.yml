name: Publish

# Manual, one-shot release.  The workflow bumps pyproject.toml and the
# changelog badge itself, builds the sdist and wheel, uploads them to PyPI
# and only then commits the version bump, tags it and opens the GitHub
# release whose notes are rendered from the changelog entry.  Because the
# commit and the tag happen after a successful upload, a failed or rejected
# upload leaves the repository untouched.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (the changelog needs a matching section)"
        required: true
        type: string
      dry_run:
        description: "Prepare the version bump, build the distributions and print the notes, but skip the upload, the commit, the tag and the release"
        required: false
        default: false
        type: boolean

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed for the "Full Changelog" compare link and for
          # the "does this tag already exist" check.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the release can be cut
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse --verify "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "tag v${VERSION} already exists" >&2
            exit 1
          fi
          python workflow/changelog_to_md.py --version "$VERSION" --check

      - name: Bump the version and the changelog badge
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python workflow/prepare_release.py --version "$VERSION"
          python workflow/check_release_version.py "$VERSION"
          git --no-pager diff

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

      - name: Render the release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if PREVIOUS=$(git describe --tags --abbrev=0 HEAD 2>/dev/null); then
            python workflow/changelog_to_md.py \
              --version "$VERSION" \
              --previous "${PREVIOUS#v}" \
              --out release-notes.md
          else
            python workflow/changelog_to_md.py \
              --version "$VERSION" \
              --out release-notes.md
          fi
          cat release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  publish:
    name: Publish, tag and release
    needs: prepare
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/project/manim-extensions/
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Reproduce the exact version bump that went into the build, so the
      # release commit matches the uploaded distributions.
      - name: Bump the version and the changelog badge
        env:
          VERSION: ${{ inputs.version }}
        run: python workflow/prepare_release.py --version "$VERSION"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Check the PyPI token
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_TOKEN" ]; then
            echo "the PYPI_API_TOKEN secret is missing; add it under Settings -> Secrets and variables -> Actions" >&2
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Commit the version bump, tag it and open the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "releases are cut from main, not ${GITHUB_REF}" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml docs/source/changelog.rst
          if git diff --cached --quiet; then
            echo "the tree already sits on version ${VERSION}"
          else
            git commit -m "Release ${VERSION}"
          fi
          git push origin HEAD:main
          gh release create "v${VERSION}" \
            --target "$(git rev-parse HEAD)" \
            --title "Manim Extensions ${VERSION}" \
            --notes-file release-notes.md
