name: Docs media

# Pre-render every .. manim:: doc example and push the media tree to the
# `rtd-media` branch. Read the Docs fetches that branch before building so
# the Sphinx build reuses the media instead of rendering hundreds of
# examples (which used to time the RTD build out). Rendering is
# content-hash based, so unchanged examples are skipped on re-runs.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-manim-env
        with:
          # 3.12 so the manim-mobject-svg plugin (python<3.13 pin) installs
          # and HTMLParsedVMobject examples render; matches the RTD build.
          python-version: "3.12"
          install-full-deps: "true"

      - name: Install package with all extras
        run: pip install ".[all]"

      - name: Render all doc examples
        run: python workflow/render_doc_examples.py --out media_cache --workers 6

      - name: Push media to the rtd-media branch
        id: push
        run: |
          set -e
          cd media_cache
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin rtd-media || true
          git checkout -B rtd-media
          git add -A
          if git diff --cached --quiet; then
            echo "Media unchanged; nothing to push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -q -m "docs media: refresh rendered examples"
            git push -f origin rtd-media
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Trigger a Read the Docs build only after fresh media is on the
      # rtd-media branch, so RTD never builds against a stale or missing
      # media cache. Requires a Read the Docs API token stored as the
      # READTHEDOCS_API_TOKEN repository secret; without it this step is a
      # no-op (and RTD's default push webhook keeps working as before).
      - name: Trigger Read the Docs build
        if: steps.push.outputs.pushed == 'true'
        env:
          RTD_TOKEN: ${{ secrets.READTHEDOCS_API_TOKEN }}
        run: |
          if [ -z "$RTD_TOKEN" ]; then
            echo "READTHEDOCS_API_TOKEN secret not set; skipping RTD trigger."
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: Token $RTD_TOKEN" \
            "https://app.readthedocs.org/api/v3/projects/manim-extensions/versions/latest/builds/" \
            && echo "Read the Docs build triggered."
