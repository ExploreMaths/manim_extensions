name: Docs media

# Pre-render every .. manim:: doc example and push the media tree to the
# `rtd-media` branch. Read the Docs fetches that branch before building so
# the Sphinx build reuses the media instead of rendering hundreds of
# examples (which used to time the RTD build out). Rendering is
# content-hash based, so unchanged examples are skipped on re-runs.
#
# The same branch also carries the vendored-status cache: the `render`
# job refreshes it on every push (so the RTD build always sees fresh
# data), and the `vendored-cache` job refreshes it daily between pushes
# without triggering a Read the Docs build.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  schedule:
    # Refresh the vendored-status cache daily at ~02:29 UTC.
    - cron: "29 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    # Media rendering and the RTD trigger only happen for pushes/tags; the
    # daily schedule is handled by the vendored-cache job below.
    if: ${{ github.event_name != 'schedule' }}
    # Serialize pushes to the rtd-media branch: each run does `git push -f`,
    # so concurrent runs (e.g. a fast sequence of commits to main) would
    # race and the last push wins, even if an earlier run rendered newer
    # media. Cancelling superseded runs avoids that race and saves CI
    # minutes. Scoped to this job so a scheduled vendored-cache run never
    # cancels (or gets cancelled by) a media render.
    concurrency:
      group: docs-media
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seed media cache from the rtd-media branch
        run: |
          git clone --depth 1 --branch rtd-media \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            rtd-media-clone || { echo "No existing media cache; rendering from scratch."; exit 0; }
          mkdir -p media_cache
          cp -r rtd-media-clone/videos rtd-media-clone/images rtd-media-clone/manifest.json media_cache/ 2>/dev/null || true

      # Lightweight scan (no manim needed): if every example is already in
      # the cache at the requested quality, skip the whole render pipeline
      # below — including the TeX/LaTeX environment setup.
      - name: Check whether any rendering is needed
        id: needed
        run: |
          if python workflow/render_doc_examples.py --out media_cache --quality high --check; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-manim-env
        if: steps.needed.outputs.needed == 'true'
        with:
          # 3.12 so the manim-mobject-svg plugin (python<3.13 pin) installs
          # and HTMLParsedVMobject examples render; matches the RTD build.
          python-version: "3.12"
          install-full-deps: "true"

      - name: Install package with all extras
        if: steps.needed.outputs.needed == 'true'
        run: pip install ".[all]"

      - name: Render all doc examples
        if: steps.needed.outputs.needed == 'true'
        run: python workflow/render_doc_examples.py --out media_cache --workers 6 --quality high

      - name: Refresh vendored status cache
        # Runs on every push too (not only on the daily schedule) so the
        # rtd-media branch always carries a fresh cache when the RTD build
        # is triggered below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python workflow/update_vendored_status.py

      - name: Include the vendored status cache in the media tree
        run: cp docs/source/_vendored_status_cache.json media_cache/_vendored_status_cache.json

      - name: Push media to the rtd-media branch
        id: push
        run: |
          set -e
          cd media_cache
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin rtd-media || true
          git checkout -B rtd-media
          git add -A
          if git diff --cached --quiet; then
            echo "Media unchanged; nothing to push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -q -m "docs media: refresh rendered examples"
            git push -f origin rtd-media
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Trigger a Read the Docs build. Branch pushes: only after fresh media
      # is on the rtd-media branch (no point rebuilding otherwise). Tag
      # pushes: always — the tagged docs version must be built even when
      # the media cache is unchanged. Without the secret this is a no-op.
      - name: Trigger Read the Docs build
        if: ${{ steps.push.outputs.pushed == 'true' || github.ref_type == 'tag' }}
        env:
          RTD_TOKEN: ${{ secrets.READTHEDOCS_API_TOKEN }}
          RTD_PROJECT: manim-extensions
        run: |
          if [ -z "$RTD_TOKEN" ]; then
            echo "READTHEDOCS_API_TOKEN secret not set; skipping RTD trigger."
            exit 0
          fi
          BASE="https://app.readthedocs.org/api/v3/projects/$RTD_PROJECT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            # Without the push webhook RTD never sees the new tag, so ask it
            # to sync versions from the repo first, then resolve the slug
            # (RTD slugifies tag names) and build that version.
            curl -sf -X POST -H "Authorization: Token $RTD_TOKEN" "$BASE/versions/" \
              || echo "WARNING: version sync call failed, continuing anyway"
            SLUG=$(curl -sf -H "Authorization: Token $RTD_TOKEN" "$BASE/versions/?limit=100" \
              | jq -r --arg tag "$TAG" '.results[] | select(.verbose_name == $tag) | .slug' | head -1)
            if [ -z "$SLUG" ]; then
              echo "No RTD version for tag $TAG yet; waiting 30s for the sync..."
              sleep 30
              SLUG=$(curl -sf -H "Authorization: Token $RTD_TOKEN" "$BASE/versions/?limit=100" \
                | jq -r --arg tag "$TAG" '.results[] | select(.verbose_name == $tag) | .slug' | head -1)
            fi
            if [ -z "$SLUG" ]; then
              echo "ERROR: could not resolve an RTD version for tag $TAG."
              exit 1
            fi
            TARGET="$BASE/versions/$SLUG/builds/"
            echo "Triggering RTD build for tag $TAG (version slug: $SLUG)"
          else
            TARGET="$BASE/versions/latest/builds/"
          fi
          curl -sf -X POST -H "Authorization: Token $RTD_TOKEN" "$TARGET" \
            && echo "Read the Docs build triggered."

  # Daily refresh of the vendored-status cache between pushes. Kept in this
  # workflow so the rtd-media branch has a single writer pipeline; this job
  # deliberately does NOT trigger a Read the Docs build.
  vendored-cache:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch previous cache
        run: |
          git fetch --depth 1 origin rtd-media || true
          git show origin/rtd-media:_vendored_status_cache.json \
            > /tmp/old_cache.json 2>/dev/null || echo '{}' > /tmp/old_cache.json

      - name: Refresh cache
        env:
          # Provided automatically; raises the GitHub API rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python workflow/update_vendored_status.py --old-cache /tmp/old_cache.json --summary /tmp/summary.txt

      - name: Publish cache to the rtd-media branch
        run: |
          git clone --depth 1 --branch rtd-media \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            rtd-media-clone
          cp docs/source/_vendored_status_cache.json \
            rtd-media-clone/_vendored_status_cache.json
          cd rtd-media-clone
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _vendored_status_cache.json
          git commit --allow-empty -m "$(cat /tmp/summary.txt)"
          git pull --rebase origin rtd-media
          git push origin rtd-media
