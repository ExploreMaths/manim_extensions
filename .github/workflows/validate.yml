name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate-manim-directives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ExploreMaths/setup-manim-env@v1
        with:
          install-editable: "true"
      - name: Run manim directive validator
        run: python workflow/validate_manim_directives.py

  validate-param-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ExploreMaths/setup-manim-env@v1
        with:
          install-editable: "true"
      - name: Run parameter docs validator
        run: python workflow/validate_param_docs.py

  validate-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ExploreMaths/setup-manim-env@v1
        with:
          install-editable: "true"
      - name: Install optional dependencies referenced in docs
        run: pip install ".[ml]"
      - name: Run reference validator
        run: python workflow/validate_refs.py

  validate-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ExploreMaths/setup-manim-env@v1
        with:
          install-editable: "true"
      - name: Run import style checker
        run: python workflow/check_redundant_imports.py

  validate-relative-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ExploreMaths/setup-manim-env@v1
        with:
          install-editable: "true"
      - name: Check that all in-package imports use relative imports
        run: python workflow/check_relative_imports.py

  validate-docstrings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ExploreMaths/setup-manim-env@v1
        with:
          install-editable: "true"
      - name: Run module docstring validator
        run: python workflow/validate_docstrings.py

  validate-doc-sections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ExploreMaths/setup-manim-env@v1
        with:
          install-editable: "true"
      - name: Run docstring section validator
        run: python workflow/validate_doc_sections.py

  validate-rst:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install docutils
        run: pip install docutils
      - name: Validate RST formatting in docs and docstrings
        run: python workflow/validate_rst.py

  validate-example-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ExploreMaths/setup-manim-env@v1
        with:
          # Examples construct MathTex/Text and import every extra, so
          install-editable: "true"
          # mirror the full docs-cache environment.
          install-full-deps: "true"
      - name: Install package with all extras
        run: pip install ".[all]"
      - name: Check doc example layout
        run: python workflow/check_example_layout.py

  validate-api-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ExploreMaths/setup-manim-env@v1
        with:
          install-editable: "true"
      - name: Check API documentation coverage
        run: python workflow/validate_api_coverage.py

  reuse-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install reuse
        run: pip install reuse
      - name: Run reuse lint
        run: reuse lint

  validate-type-annotations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that all function parameters have type annotations
        run: python scripts/check_type_annotations.py

  flake8-unused-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install flake8
        run: pip install flake8
      - name: Check unused imports
        run: flake8 manim_extensions --select F401 --exclude "*__init__.py*,test,examples"

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ExploreMaths/setup-manim-env@v1
        with:
          install-editable: "true"
      - name: Install package with all extras
        run: pip install ".[all]"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --desc on