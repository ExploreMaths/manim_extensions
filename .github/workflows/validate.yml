name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate-manim-directives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ExploreMaths/setup-manim-env@v1
        with:
          install-editable: "true"
      - name: Run manim directive validator
        run: python workflow/validate_manim_directives.py

  validate-param-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ExploreMaths/setup-manim-env@v1
        with:
          install-editable: "true"
      - name: Run parameter docs validator
        run: python workflow/validate_param_docs.py

  validate-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ExploreMaths/setup-manim-env@v1
        with:
          install-editable: "true"
      - name: Install optional dependencies referenced in docs
        run: pip install ".[all]"
      - name: Run reference validator
        run: python workflow/validate_refs.py

  validate-intersphinx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that external-library cross-references have intersphinx mappings
        run: python workflow/validate_intersphinx.py

  validate-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ExploreMaths/setup-manim-env@v1
        with:
          install-editable: "true"
      - name: Run import style checker
        run: python workflow/check_redundant_imports.py

  validate-relative-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ExploreMaths/setup-manim-env@v1
        with:
          install-editable: "true"
      - name: Check that all in-package imports use relative imports
        run: python workflow/check_relative_imports.py

  validate-docstrings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ExploreMaths/setup-manim-env@v1
        with:
          install-editable: "true"
      - name: Run module docstring validator
        run: python workflow/validate_docstrings.py

  validate-doc-sections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ExploreMaths/setup-manim-env@v1
        with:
          install-editable: "true"
      - name: Run docstring section validator
        run: python workflow/validate_doc_sections.py

  validate-rst:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install docutils
        run: pip install docutils
      - name: Validate RST formatting in docs and docstrings
        run: python workflow/validate_rst.py

  validate-example-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ExploreMaths/setup-manim-env@v1
        with:
          # Examples construct MathTex/Text and import every extra, so
          install-editable: "true"
          # mirror the full docs-cache environment.
          install-full-deps: "true"
      - name: Install package with all extras
        run: pip install ".[all]"
      - name: Install dvisvgm >= 2.4 (for dvi -> svg probe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dvisvgm
          dvisvgm --version
      - name: Check doc example layout
        run: python workflow/check_example_layout.py

  validate-api-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ExploreMaths/setup-manim-env@v1
        with:
          install-editable: "true"
      - name: Check API documentation coverage
        run: python workflow/validate_api_coverage.py

  reuse-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install reuse
        run: pip install reuse
      - name: Run reuse lint
        run: reuse lint

  validate-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SPDX header blocks
        run: python workflow/validate_headers.py

  validate-type-annotations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check type annotations (params annotated, none quoted)
        run: python scripts/check_type_annotations.py

  validate-return-annotations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that documented public functions with return values declare a return annotation
        run: python scripts/check_return_annotations.py

  black-changed-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Black
        run: pip install black
      - name: Resolve the base revision
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            before=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "sha=$before" >> "$GITHUB_OUTPUT"
      - name: Check that changed Python files are Black-formatted
        run: python scripts/check_black_changed.py --base "${{ steps.base.outputs.sha }}"

  flake8-unused-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install flake8
        run: pip install flake8
      - name: Check unused imports
        run: flake8 manim_extensions --select F401 --exclude "*__init__.py*,test,examples"

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ExploreMaths/setup-manim-env@v1
        with:
          install-editable: "true"
      - name: Install package with all extras
        run: pip install ".[all]"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --desc on