name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install docutils
        run: pip install docutils
      - name: Run static checks
        run: python workflow/run_checks.py --group static

  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ExploreMaths/setup-manim-env@v1
        with:
          install-editable: "true"
      - name: Install optional dependencies referenced in docs
        run: pip install ".[all]"
      - name: Run package and documentation checks
        run: python workflow/run_checks.py --group package

  validate-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ExploreMaths/setup-manim-env@v1
        with:
          # Examples construct MathTex/Text and import every extra, so
          install-editable: "true"
          # mirror the full docs-cache environment.
          install-full-deps: "true"
      - name: Install package with all extras
        run: pip install ".[all]"
      - name: Install dvisvgm >= 2.4 (for dvi -> svg probe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dvisvgm
          dvisvgm --version
      - name: Check doc example layout
        run: python workflow/run_checks.py --group layout

  validate-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lint tools
        run: pip install black flake8 reuse
      - name: Run lint checks
        run: python workflow/run_checks.py --group lint

  validate-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ExploreMaths/setup-manim-env@v1
        with:
          install-editable: "true"
      - name: Install package with all extras
        run: pip install ".[all]"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies for known vulnerabilities
        run: python workflow/run_checks.py --group audit
