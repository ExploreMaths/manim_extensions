version: 2

# The documentation is built by GitHub Actions (see .github/workflows/docs-cache.yml)
# and published to the `rtd-html` branch. Read the Docs copies the latest
# prebuilt HTML into its output directory; it never runs Sphinx or renders
# Manim examples itself.  Waiting for the exact commit would time out
# whenever a non-docs commit does not publish a new artifact.
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - |
      set -e
      rm -rf /tmp/rtd-html
      git clone --depth 1 --branch rtd-html \
        https://github.com/ExploreMaths/manim_extensions.git /tmp/rtd-html
      if [ ! -f /tmp/rtd-html/html/index.html ]; then
        echo "No prebuilt HTML artifact found on the rtd-html branch."
        exit 1
      fi
      echo "Copying prebuilt HTML for $(cat /tmp/rtd-html/commit) (RTD commit $READTHEDOCS_GIT_COMMIT_HASH)."
    - mkdir -p "$READTHEDOCS_OUTPUT/html"
    - cp -a /tmp/rtd-html/html/. "$READTHEDOCS_OUTPUT/html/"

formats:
  - htmlzip
