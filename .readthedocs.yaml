version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - ffmpeg
    - fonts-noto-cjk
    - graphviz
    - libcairo2-dev
    - libpango1.0-dev
    - libffi-dev
    - pkg-config
  timeout: 900

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

formats:
  - htmlzip