version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - ffmpeg
    - fonts-jetbrains-mono
    - fonts-noto-cjk
    - fonts-hosny-amiri
    - graphviz
    - libcairo2-dev
    - libpango1.0-dev
    - libffi-dev
    - pkg-config
  jobs:
    pre_build:
      # Install the vendored Nerd Font before Sphinx starts. Pango (>= 1.52,
      # ubuntu-24.04) snapshots available fonts at initialization and ignores
      # fonts registered later, so QR-code icons must be on disk beforehand
      # (see manim_extensions/utils/nerdfont/icons.py). Examples missing from
      # the CI media cache are rendered in-process by the Sphinx build.
      - python -c "import manim_extensions.utils.nerdfont as nf; nf._install_font_linux()"
      # Fetch the vendored-status cache maintained by the Vendored status
      # cache workflow on the vendored-status-cache branch (refreshed
      # daily). The vendored-status directive renders without upstream
      # data when this file is missing. See
      # .github/workflows/vendored-status.yml.
      - git fetch --depth 1 origin vendored-status-cache && git checkout origin/vendored-status-cache -- docs/source/_vendored_status_cache.json || true
      # Fetch the CI-pre-rendered example media so the Sphinx build reuses
      # it instead of rendering every example (see
      # .github/workflows/docs-media.yml). Examples missing from the cache
      # still render normally as a fallback.
      - git clone --depth 1 --branch rtd-media https://github.com/ExploreMaths/manim_extensions.git /tmp/rtd-media || true

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

formats:
  - htmlzip